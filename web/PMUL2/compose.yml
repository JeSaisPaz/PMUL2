services:
  mysql:
    image: mysql:latest
    container_name: pmul2_db
    restart: always
    volumes:
      - db_pmul2_data:/var/lib/mysql
    env_file:
      - db_pmul2.env
    environment:
      - TZ=Europe/Brussels
    networks:
      - nt-pmul2

  phpmyadmin :
    image: arm64v8/phpmyadmin:latest
    container_name: pmul2_phpmyadmin
    restart: always
    env_file:
      - db_pmul2.env
    depends_on: 
      - mysql
    ports:
      - "8080:80"
    environment:
      - TZ=Europe/Brussels
    networks:
      - nt-pmul2

  app:
    image: node:latest
    container_name: pmul2_app
    user: node
    restart: always
    working_dir: /home/node/app
    volumes:
      - ./pmul2-team01-app:/home/node/app
      #- /home/node/app/node_modules       #volume anonyme pour node module
    command: ["bash", "./boot.sh"]
    expose:
      - 3000
    ports:
      - "3000:3000"
    env_file:
      - db_pmul2.env
    networks:
      - nt-pmul2

networks:
  nt-pmul2:
    driver: bridge

volumes:
  db_pmul2_data:
